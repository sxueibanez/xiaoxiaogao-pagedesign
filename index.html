<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Builder</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 确保 contenteditable 的元素有类似 input 的体验，且换行正常 */
        [contenteditable] {
            word-break: break-word;
        }
        /* 针对输入框内图片的简单排版优化 */
        [contenteditable] img {
            max-width: 100%;
            margin-top: 8px;
            margin-bottom: 8px;
            border: 2px solid #e5e7eb;
        }
    </style>
</head>
<body class="min-h-screen bg-[#a8cca9] py-12 px-4 sm:px-6 lg:px-8 font-sans text-black flex justify-center">

    <!-- 主容器：模仿图片外围的粗边框 -->
    <div class="w-full max-w-3xl border-[4px] border-black bg-[#C7EDCC] p-8 sm:p-12 shadow-xl">
        
        <!-- ================= 群号输入区域 ================= -->
        <div class="mb-12 border-[4px] border-black flex items-center p-4 bg-[#e6f4e8]">
            <span class="font-bold text-2xl mr-4 whitespace-nowrap">群号：</span>
            <input 
                type="text" 
                id="group-id-input" 
                placeholder="请输入群号..." 
                class="w-full text-2xl font-bold outline-none placeholder-gray-400 bg-transparent"
            >
        </div>

        <!-- ================= 短句列表区域 ================= -->
        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider">短句列表：</h2>
            
            <div id="phrases-container" class="space-y-6 mb-6">
                <!-- 动态短句会插入在这里 -->
            </div>

            <!-- 添加按钮 -->
            <div class="flex items-start">
                <div class="w-8 shrink-0"></div>
                <button 
                    onclick="addPhrase()"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]"
                >
                    <span class="mb-2 tracking-wide">点击添加新的短句</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <!-- ================= 指令列表区域 ================= -->
        <div>
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider">指令列表：</h2>
            
            <div id="commands-container" class="space-y-6 mb-6">
                <!-- 动态指令会插入在这里 -->
            </div>

            <!-- 添加按钮 -->
            <div class="flex items-start">
                <button 
                    onclick="addCommand()"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]"
                >
                    <span class="mb-2 tracking-wide">点击添加新的指令</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <!-- 导入和提交按钮 -->
        <div class="mt-16 flex flex-col sm:flex-row justify-center gap-6">
            <button 
                onclick="importData()"
                class="border-[4px] border-black bg-[#e6f4e8] text-black px-12 py-4 text-2xl font-bold tracking-widest hover:bg-[#b5e0bb] transition-all cursor-pointer shadow-[8px_8px_0px_0px_rgba(0,0,0,0.2)] active:shadow-none active:translate-y-2 active:translate-x-2"
            >
                导入 JSON
            </button>
            <button 
                onclick="submitData()"
                class="border-[4px] border-black bg-black text-white px-12 py-4 text-2xl font-bold tracking-widest hover:bg-gray-800 transition-all cursor-pointer shadow-[8px_8px_0px_0px_rgba(0,0,0,0.2)] active:shadow-none active:translate-y-2 active:translate-x-2"
            >
                保存提交
            </button>
        </div>
        
    </div>

    <!-- 隐藏的文件上传组件 (导入JSON 和 插入图片) -->
    <input type="file" id="import-file" accept=".json" class="hidden" onchange="handleFileSelect(event)">
    <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

    <!-- 自定义消息弹窗 -->
    <div id="message-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-[#C7EDCC] border-[4px] border-black p-8 max-w-sm w-full mx-4 shadow-xl">
            <p id="message-text" class="text-xl font-bold mb-8 text-center whitespace-pre-line"></p>
            <button onclick="closeModal()" class="w-full border-[3px] border-black bg-[#e6f4e8] p-3 font-bold hover:bg-[#b5e0bb] transition-colors">确定</button>
        </div>
    </div>

    <script>
        // 全局对象，用于保存导入文件的原始完整配置
        let globalOriginalData = {
            "mode": "pro",
            "super_admins": [],
            "kefus": [],
            "online_kefus": [],
            "preset_lines": [],
            "custom_commands": {},
            "paimian_lines": [],
            "huaka_lines": [],
            "laxian_gifs": [],
            "shield_words": []
        };

        // 记录导入时已有的图片路径，用于保存时对比删除
        let initialFilePaths = new Set();
        // 记录保存过程中实际使用的图片路径
        let usedFilePaths = new Set();

        // 记录当前正在编辑/要插入图片的容器
        let currentEditTarget = null;

        function triggerImageUpload(btnElement) {
            currentEditTarget = btnElement.previousElementSibling;
            document.getElementById('image-upload').click();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                if (currentEditTarget) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    currentEditTarget.appendChild(img);
                    currentEditTarget.appendChild(document.createElement('br'));
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // 删除列表项功能
        function deleteItem(btnElement, type) {
            const itemRow = btnElement.closest('.flex.items-start');
            if (itemRow) {
                itemRow.remove();
                
                // 如果是短句，需要重新计算序号
                if (type === 'phrase') {
                    const indices = document.querySelectorAll('.phrase-index');
                    indices.forEach((el, idx) => {
                        el.innerText = (idx + 1) + '.';
                    });
                }
            }
        }

        function addPhrase(content = '') {
            const container = document.getElementById('phrases-container');
            const index = container.children.length + 1;
            const html = `
                <div class="flex items-start phrase-item">
                    <div class="w-8 shrink-0 font-bold text-xl mt-3 phrase-index">${index}.</div>
                    <div class="grow border-[3px] border-black p-4 min-h-[120px] font-bold relative group">
                        <div class="focus:outline-none empty:before:content-[attr(placeholder)] empty:before:text-gray-400 cursor-text w-full h-full min-h-[80px] pb-8 outline-none"
                            contenteditable="true" placeholder="可以添加任何文字和图片">${content}</div>
                        <button onclick="triggerImageUpload(this)" title="插入图片" class="absolute bottom-2 right-2 border-[2px] border-black px-2 py-1 text-xs bg-[#e6f4e8] hover:bg-[#b5e0bb] cursor-pointer transition-colors shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-0.5 active:translate-x-0.5">
                            🖼️ 插入图片
                        </button>
                    </div>
                    <!-- 删除按钮 -->
                    <button onclick="deleteItem(this, 'phrase')" title="删除此项" class="ml-4 shrink-0 border-[3px] border-black w-12 h-12 flex items-center justify-center font-black text-2xl bg-[#e6f4e8] hover:bg-red-500 hover:text-white transition-colors cursor-pointer shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1">X</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        function addCommand(trigger = '', content = '') {
            const container = document.getElementById('commands-container');
            const html = `
                <div class="flex items-start">
                    <div class="grow flex border-[3px] border-black min-h-[120px]">
                        <div class="w-1/3 border-r-[3px] border-black p-4 font-bold">
                            <div class="focus:outline-none empty:before:content-[attr(placeholder)] empty:before:text-gray-400 cursor-text w-full h-full outline-none"
                                contenteditable="true" placeholder="触发词：">${trigger}</div>
                        </div>
                        <div class="w-2/3 p-4 font-bold relative group">
                            <div class="focus:outline-none empty:before:content-[attr(placeholder)] empty:before:text-gray-400 cursor-text w-full h-full min-h-[80px] pb-8 outline-none"
                                contenteditable="true" placeholder="可以添加任何文字和图片">${content}</div>
                            <button onclick="triggerImageUpload(this)" title="插入图片" class="absolute bottom-2 right-2 border-[2px] border-black px-2 py-1 text-xs bg-[#e6f4e8] hover:bg-[#b5e0bb] cursor-pointer transition-colors shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-0.5 active:translate-x-0.5">
                                🖼️ 插入图片
                            </button>
                        </div>
                    </div>
                    <!-- 删除按钮 -->
                    <button onclick="deleteItem(this, 'command')" title="删除此项" class="ml-4 shrink-0 border-[3px] border-black w-12 h-12 flex items-center justify-center font-black text-2xl bg-[#e6f4e8] hover:bg-red-500 hover:text-white transition-colors cursor-pointer shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1">X</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        window.onload = function() {
            addPhrase();
            addCommand();
        };

        function showMessage(msg) {
            document.getElementById('message-text').innerText = msg;
            document.getElementById('message-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('message-modal').classList.add('hidden');
        }

        function importData() {
            document.getElementById('import-file').click();
        }

        function formatSegmentsToHtml(segments) {
            if (!segments || !Array.isArray(segments)) {
                if (typeof segments === 'string') return segments;
                return '';
            }
            let html = '';
            segments.forEach(seg => {
                if (seg.type === 'text') {
                    html += seg.text.replace(/\n/g, '<br>');
                } else if (seg.type === 'image') {
                    // 这里路径改为从 activity 文件夹读取显示
                    html += `<img src="activity/${seg.file}" data-original-file="${seg.file}">`;
                }
            });
            return html;
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    globalOriginalData = { ...globalOriginalData, ...data };
                    
                    initialFilePaths.clear();
                    
                    const filename = file.name;
                    if (filename.endsWith('.json')) {
                        document.getElementById('group-id-input').value = filename.replace('.json', '');
                    }

                    document.getElementById('phrases-container').innerHTML = '';
                    document.getElementById('commands-container').innerHTML = '';

                    const collectFiles = (segments) => {
                        if (Array.isArray(segments)) {
                            segments.forEach(s => { if(s.type === 'image') initialFilePaths.add(s.file); });
                        }
                    };

                    if (data.preset_lines && Array.isArray(data.preset_lines)) {
                        data.preset_lines.forEach(lineSegments => {
                            collectFiles(lineSegments);
                            addPhrase(formatSegmentsToHtml(lineSegments));
                        });
                    }
                    if (document.getElementById('phrases-container').children.length === 0) addPhrase();

                    if (data.custom_commands && typeof data.custom_commands === 'object') {
                        Object.entries(data.custom_commands).forEach(([trigger, segments]) => {
                            collectFiles(segments);
                            addCommand(trigger, formatSegmentsToHtml(segments));
                        });
                    }
                    if (document.getElementById('commands-container').children.length === 0) addCommand();

                    showMessage('导入成功！\n已记录当前图片状态以便删除管理。');
                } catch (err) {
                    showMessage('JSON 文件解析失败。');
                    console.error(err);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        const API_BASE_URL = "https://assignment-spots-admissions-findarticles.trycloudflare.com";

        async function submitData() {
            const groupId = document.getElementById('group-id-input').value.trim();
            if (!groupId) {
                showMessage('请先输入群号！');
                return;
            }

            showMessage('正在打包并发送数据到服务器，请稍候...');
            
            const formData = new FormData();
            formData.append('group_id', groupId);

            const preset_lines = [];
            const custom_commands = {};
            usedFilePaths.clear(); 
            let imageIndex = 0; // 用于生成唯一文件名

            async function processContent(element, type) {
                let segments = [];
                let currentText = "";

                async function traverse(node) {
                    if (node.nodeType === Node.TEXT_NODE) {
                        currentText += node.textContent;
                    } else if (node.nodeType === Node.ELEMENT_NODE) {
                        const tag = node.tagName.toLowerCase();
                        if (tag === 'br') {
                            currentText += "\n";
                        } else if (tag === 'img') {
                            if (currentText) {
                                segments.push({ type: "text", text: currentText });
                                currentText = "";
                            }
                            
                            const srcAttr = node.getAttribute('src');
                            let filePath = "";

                            // 处理新插入的图片 (Base64)
                            if (srcAttr && srcAttr.startsWith('data:image')) {
                                const parts = srcAttr.split(',');
                                const mimeType = parts[0].match(/:(.*?);/)[1];
                                const base64Data = parts[1];
                                const byteCharacters = atob(base64Data);
                                const byteNumbers = new Array(byteCharacters.length);
                                for (let j = 0; j < byteCharacters.length; j++) byteNumbers[j] = byteCharacters.charCodeAt(j);
                                const blob = new Blob([new Uint8Array(byteNumbers)], { type: mimeType });
                                
                                // 统一使用 jpg 后缀
                                const fileName = `${type}_${Date.now()}_${imageIndex++}.jpg`;
                                filePath = `${groupId}/${type}/${fileName}`;
                                
                                // 将图片文件添加到 FormData 中
                                formData.append('new_images', blob, filePath);

                                // 更新 DOM 以便后续使用
                                node.setAttribute('src', `activity/${filePath}`);
                                node.setAttribute('data-original-file', filePath);
                            } 
                            // 处理已有的图片
                            else if (node.hasAttribute('data-original-file')) {
                                filePath = node.getAttribute('data-original-file');
                            }

                            if (filePath) {
                                segments.push({ type: "image", file: filePath });
                                usedFilePaths.add(filePath); 
                            }
                        } else {
                            const isBlock = tag === 'div' || tag === 'p';
                            if (isBlock && currentText && !currentText.endsWith('\n')) currentText += '\n';
                            for (let child of node.childNodes) await traverse(child);
                            if (isBlock && currentText && !currentText.endsWith('\n')) currentText += '\n';
                        }
                    }
                }
                
                for (let child of element.childNodes) await traverse(child);
                if (currentText) segments.push({ type: "text", text: currentText.trimEnd() });
                return segments.filter(s => !(s.type === 'text' && s.text === ''));
            }

            try {
                // 1. 遍历并解析所有的短句和指令
                const phraseDivs = document.querySelectorAll('#phrases-container div[contenteditable]');
                for (const div of phraseDivs) {
                    if (div.innerText.trim() !== '' || div.querySelector('img')) {
                        const segs = await processContent(div, 'line');
                        if (segs.length > 0) preset_lines.push(segs);
                    }
                }

                const commandRows = document.querySelectorAll('#commands-container > div');
                for (const row of commandRows) {
                    const editables = row.querySelectorAll('div[contenteditable]');
                    if (editables.length === 2) {
                        const triggerText = editables[0].innerText.trim();
                        if (triggerText !== '') {
                            const segs = await processContent(editables[1], 'cmd');
                            if (segs.length > 0) custom_commands[triggerText] = segs;
                        }
                    }
                }

                // 2. 将最终的 JSON 数据添加到 FormData
                globalOriginalData.preset_lines = preset_lines;
                globalOriginalData.custom_commands = custom_commands;
                formData.append('json_data', JSON.stringify(globalOriginalData));

                // 3. 计算需要删除的图片路径并添加到 FormData
                const filesToDelete = [];
                for (const path of initialFilePaths) {
                    if (!usedFilePaths.has(path)) {
                        filesToDelete.push(path);
                    }
                }
                formData.append('deleted_images', JSON.stringify(filesToDelete));

                // 4. 发送网络请求给笔记本上的后端
                const response = await fetch(`${API_BASE_URL}/api/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`服务器响应错误: ${response.status}`);
                }

                const result = await response.json();
                
                // 5. 成功后的状态更新
                initialFilePaths = new Set(usedFilePaths);
                const deleteMsg = filesToDelete.length > 0 ? ` 并清理了 ${filesToDelete.length} 张废弃图片。` : "。";
                showMessage(`保存成功！\n数据已同步到服务器${deleteMsg}`);

            } catch (err) {
                console.error(err);
                showMessage(`同步失败，请检查服务器网络连接：\n${err.message}`);
            }
        }
    </script>
</body>
</html>
