<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [contenteditable] {
            word-break: break-word;
        }

        [contenteditable] img {
            max-width: 100%;
            margin-top: 8px;
            margin-bottom: 8px;
            border: 2px solid #e5e7eb;
        }
    </style>
</head>

<body class="min-h-screen py-12 px-4 sm:px-6 lg:px-8 font-sans text-black flex justify-center">
    <video autoplay loop muted playsinline class="fixed inset-0 w-full h-full object-cover z-[-10]">
        <source src="background.mp4" type="video/mp4">
        您的浏览器不支持 HTML5 视频。
    </video>

    <div class="w-full max-w-3xl border-[4px] border-black bg-white/10 backdrop-blur-sm p-8 sm:p-12 shadow-xl">

        <div class="mb-12 border-[4px] border-black flex flex-col sm:flex-row items-center p-4 bg-[#e6f4e8] gap-4">
            <div class="flex items-center w-full">
                <span class="font-bold text-2xl mr-2 whitespace-nowrap">群号：</span>
                <input type="text" id="group-id-input" placeholder="请输入群号..."
                    class="w-full text-2xl font-bold outline-none placeholder-gray-400 bg-transparent min-w-[50px]">
            </div>
            <button onclick="fetchServerData()"
                class="w-full sm:w-auto shrink-0 border-[3px] border-black px-6 py-2 font-bold bg-white/10 backdrop-blur-sm hover:bg-[#a8cca9] transition-colors whitespace-nowrap shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1">
                拉取现有配置
            </button>
        </div>

        <p class="text-center font-bold text-red-500 mb-8 tracking-wider">目前不支持苹果用户上传图片</p>

        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider cursor-pointer select-none"
                onclick="toggleSection('phrases-container', this)">
                短句列表：<span class="inline-block transition-transform duration-200 text-sm -rotate-90">▼</span>
            </h2>
            <div id="phrases-container" class="space-y-6 mb-6 hidden"></div>
            <div class="flex items-start hidden">
                <button onclick="addPhrase()"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]">
                    <span class="mb-2 tracking-wide">点击添加新的短句</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider cursor-pointer select-none"
                onclick="toggleSection('commands-container', this)">
                指令列表：<span class="inline-block transition-transform duration-200 text-sm -rotate-90">▼</span>
            </h2>
            <div id="commands-container" class="space-y-6 mb-6 hidden"></div>
            <div class="flex items-start hidden">
                <button onclick="addCommand()"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]">
                    <span class="mb-2 tracking-wide">点击添加新的指令</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider cursor-pointer select-none"
                onclick="toggleSection('paimian-container', this)">
                排面模板列表：<span class="inline-block transition-transform duration-200 text-sm -rotate-90">▼</span>
            </h2>
            <div id="paimian-container" class="space-y-6 mb-6 hidden"></div>
            <div class="flex items-start hidden">
                <button onclick="addTextItem('paimian-container', '', '请输入排面模板内容 (支持多行，可用变量如 名字、金额)...')"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]">
                    <span class="mb-2 tracking-wide">点击添加新排面模板</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider cursor-pointer select-none"
                onclick="toggleSection('huaka-container', this)">
                划卡模板列表：<span class="inline-block transition-transform duration-200 text-sm -rotate-90">▼</span>
            </h2>
            <div id="huaka-container" class="space-y-6 mb-6 hidden"></div>
            <div class="flex items-start hidden">
                <button onclick="addTextItem('huaka-container', '', '请输入划卡模板内容 (支持多行，可用变量如 会员1、接待1、金额1)...')"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]">
                    <span class="mb-2 tracking-wide">点击添加新划卡模板</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider cursor-pointer select-none"
                onclick="toggleSection('shield-container', this)">
                屏蔽词列表：<span class="inline-block transition-transform duration-200 text-sm -rotate-90">▼</span>
            </h2>
            <div id="shield-container" class="space-y-6 mb-6 hidden"></div>
            <div class="flex items-start hidden">
                <button onclick="addTextItem('shield-container', '', '请输入需要拦截的屏蔽词...')"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]">
                    <span class="mb-2 tracking-wide">点击添加新屏蔽词</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <div>
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider">拉线GIF (添加之后才能触发‘呼叫客服’)：</h2>
            <div id="laxian-paste-zone" tabindex="0"
                class="flex flex-col items-center justify-center border-[3px] border-black p-8 bg-[#e6f4e8] relative min-h-[200px] outline-none">
                <div id="laxian-preview" class="mb-6 empty:hidden flex justify-center w-full"></div>
                <div class="flex gap-4">
                    <button onclick="triggerLaxianUpload()"
                        class="border-[3px] border-black p-3 font-bold hover:bg-[#b5e0bb] transition-colors cursor-pointer bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1">
                        <span id="laxian-btn-text">点击上传/粘贴更换GIF</span>
                    </button>
                    <button onclick="clearLaxian()" id="laxian-clear-btn"
                        class="hidden border-[3px] border-black p-3 font-bold bg-red-400 hover:bg-red-500 text-white transition-colors cursor-pointer shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1">
                        删除当前图片
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-16 flex flex-col sm:flex-row justify-center gap-6">
            <button onclick="submitData()"
                class="border-[4px] border-black bg-black text-white px-12 py-4 text-2xl font-bold tracking-widest hover:bg-gray-800 transition-all cursor-pointer shadow-[8px_8px_0px_0px_rgba(0,0,0,0.2)] active:shadow-none active:translate-y-2 active:translate-x-2">保存提交</button>
        </div>

    </div>

    <input type="file" id="image-upload" accept="image/jpeg, image/png, image/gif, image/webp" multiple class="hidden"
        onchange="handleImageUpload(event)">
    <input type="file" id="laxian-upload" accept="image/gif, image/jpeg, image/png, image/webp" class="hidden"
        onchange="handleLaxianUpload(event)">

    <div id="message-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white/10 backdrop-blur-sm border-[4px] border-black p-8 max-w-sm w-full mx-4 shadow-xl">
            <p id="message-text" class="text-xl font-bold mb-8 text-center whitespace-pre-line"></p>
            <button onclick="closeModal()"
                class="w-full border-[3px] border-black bg-[#e6f4e8] p-3 font-bold hover:bg-[#b5e0bb] transition-colors">确定</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://api.xiaoxiaogao.xyz";
        let currentToken = "";

        // 全局初始数据，保留完整字段结构
        let globalOriginalData = {
            "mode": "pro", "super_admins": [], "kefus": [], "online_kefus": [],
            "preset_lines": [], "custom_commands": {}, "paimian_lines": [],
            "huaka_lines": [], "laxian_gifs": [], "shield_words": []
        };

        let initialFilePaths = new Set();
        let usedFilePaths = new Set();
        let currentEditTarget = null;

        // 全局拖拽排序逻辑 (用于短句列表)
        let dragSrcEl = null;

        document.addEventListener('mousedown', function (e) {
            const handle = e.target.closest('.drag-handle');
            if (handle && !e.target.closest('button') && !e.target.closest('.collapse-arrow')) {
                const item = handle.closest('.phrase-item');
                if (item) item.setAttribute('draggable', 'true');
            }
        });

        document.addEventListener('mouseup', function (e) {
            document.querySelectorAll('.phrase-item[draggable="true"]').forEach(item => {
                item.setAttribute('draggable', 'false');
            });
        });

        // 移动端 Touch 拖拽支持
        let touchDragSrcEl = null;

        document.addEventListener('touchstart', function (e) {
            const handle = e.target.closest('.drag-handle');
            if (handle && !e.target.closest('button') && !e.target.closest('.collapse-arrow')) {
                const item = handle.closest('.phrase-item');
                if (item) {
                    touchDragSrcEl = item;
                    setTimeout(() => item.classList.add('opacity-40', 'scale-[0.98]'), 0);
                }
            }
        }, { passive: false });

        document.addEventListener('touchmove', function (e) {
            if (!touchDragSrcEl) return;
            e.preventDefault(); // 防止拖拽时页面跟着滚动

            const touch = e.touches[0];
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!targetEl) return;

            const targetItem = targetEl.closest('.phrase-item');
            if (targetItem && targetItem !== touchDragSrcEl && touchDragSrcEl.parentNode.contains(targetItem)) {
                const rect = targetItem.getBoundingClientRect();
                const next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                const container = touchDragSrcEl.parentNode;
                container.insertBefore(touchDragSrcEl, next ? targetItem.nextSibling : targetItem);
                
                const indices = container.querySelectorAll('.phrase-index');
                indices.forEach((el, idx) => { el.innerText = (idx + 1) + '.'; });
            }
        }, { passive: false });

        document.addEventListener('touchend', function (e) {
            if (touchDragSrcEl) {
                touchDragSrcEl.classList.remove('opacity-40', 'scale-[0.98]');
                touchDragSrcEl = null;
            }
        });

        document.addEventListener('touchcancel', function (e) {
            if (touchDragSrcEl) {
                touchDragSrcEl.classList.remove('opacity-40', 'scale-[0.98]');
                touchDragSrcEl = null;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const phrasesContainer = document.getElementById('phrases-container');

            phrasesContainer.addEventListener('dragstart', function (e) {
                const item = e.target.closest('.phrase-item');
                if (item) {
                    dragSrcEl = item;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', '');
                    setTimeout(() => item.classList.add('opacity-40', 'scale-[0.98]'), 0);
                }
            });

            phrasesContainer.addEventListener('dragover', function (e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                
                const targetItem = e.target.closest('.phrase-item');
                if (targetItem && targetItem !== dragSrcEl) {
                    const rect = targetItem.getBoundingClientRect();
                    const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    phrasesContainer.insertBefore(dragSrcEl, next ? targetItem.nextSibling : targetItem);
                    
                    const indices = phrasesContainer.querySelectorAll('.phrase-index');
                    indices.forEach((el, idx) => { el.innerText = (idx + 1) + '.'; });
                }
            });

            phrasesContainer.addEventListener('dragend', function (e) {
                if (dragSrcEl) {
                    dragSrcEl.classList.remove('opacity-40', 'scale-[0.98]');
                    dragSrcEl.setAttribute('draggable', 'false');
                    dragSrcEl = null;
                }
            });
        });

        // 全局富文本输入框粘贴事件接管（完美捕获图片流）
        document.addEventListener('paste', function (e) {
            const target = e.target;
            if (target.closest('[contenteditable="true"]')) {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        e.preventDefault();
                        const file = items[i].getAsFile();
                        const reader = new FileReader();
                        reader.onload = function (event) {
                            document.execCommand('insertImage', false, event.target.result);
                        };
                        reader.readAsDataURL(file);
                        break;
                    }
                }
            }
        });

        function toggleItemContent(btnElement) {
            const item = btnElement.closest('.phrase-item, .command-item, .text-item');
            if (item) {
                const content = item.querySelector('.p-4');
                if (content) content.classList.toggle('hidden');
                btnElement.classList.toggle('-rotate-90');
            }
        }

        function toggleSection(containerId, headerElement) {
            const container = document.getElementById(containerId);
            container.classList.toggle('hidden');

            if (container.nextElementSibling) {
                container.nextElementSibling.classList.toggle('hidden');
            }

            const arrow = headerElement.querySelector('span');
            if (arrow) {
                arrow.classList.toggle('-rotate-90');
            }
        }

        function triggerImageUpload(btnElement) {
            currentEditTarget = btnElement.previousElementSibling;
            document.getElementById('image-upload').click();
        }

        function handleImageUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0 || !currentEditTarget) return;

            let loadedCount = 0;
            // 遍历所有被选中的文件
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    currentEditTarget.appendChild(img);
                    
                    loadedCount++;
                    if (loadedCount === files.length) {
                        currentEditTarget.appendChild(document.createElement('br'));
                        currentEditTarget.appendChild(document.createElement('br'));
                    }
                };
                reader.readAsDataURL(file);
            }
            // 清空 input 值，保证下次选择相同图片仍能正常触发 change 事件
            event.target.value = '';
        }
        function triggerLaxianUpload() { document.getElementById('laxian-upload').click(); }

        function handleLaxianUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const previewDiv = document.getElementById('laxian-preview');
                previewDiv.innerHTML = `<img src="${e.target.result}" style="max-height: 250px; border: 4px solid black;">`;
                document.getElementById('laxian-btn-text').innerText = "更换GIF";
                document.getElementById('laxian-clear-btn').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function clearLaxian() {
            document.getElementById('laxian-preview').innerHTML = '';
            document.getElementById('laxian-btn-text').innerText = "点击上传/粘贴更换GIF";
            document.getElementById('laxian-clear-btn').classList.add('hidden');
        }

        function deleteItem(btnElement, type) {
            const itemRow = btnElement.closest('.phrase-item, .command-item');
            if (itemRow) {
                itemRow.remove();
                if (type === 'phrase') {
                    const indices = document.querySelectorAll('.phrase-index');
                    indices.forEach((el, idx) => { el.innerText = (idx + 1) + '.'; });
                }
            }
        }

        function deleteTextItem(btnElement) {
            const itemRow = btnElement.closest('.text-item');
            if (itemRow) {
                const container = itemRow.parentElement;
                itemRow.remove();
                const indices = container.querySelectorAll('.item-index');
                indices.forEach((el, idx) => { el.innerText = (idx + 1) + '.'; });
            }
        }

        function addPhrase(content = '') {
            const container = document.getElementById('phrases-container');
            const index = container.children.length + 1;
            const html = `
                <div class="phrase-item border-[3px] border-black bg-white/40 group transition-all duration-200">
                    <div class="drag-handle flex justify-between items-center border-b-[3px] border-black px-3 py-1.5 bg-[#e6f4e8] cursor-move" title="按住此处拖拽排序">
                        <div class="flex items-center gap-2">
                            <span class="collapse-arrow inline-block transition-transform duration-200 text-sm cursor-pointer px-1 hover:text-gray-500 -rotate-90" onclick="toggleItemContent(this)" title="展开/收起">▼</span>
                            <span class="font-black text-base phrase-index pointer-events-none">${index}.</span>
                            <span class="text-xs text-gray-500 font-bold pointer-events-none">按住此处拖拽排序</span>
                        </div>
                        <button onclick="deleteItem(this, 'phrase')" title="删除此项" class="border-[2px] border-black w-7 h-7 flex items-center justify-center font-black text-sm bg-white hover:bg-red-500 hover:text-white transition-colors cursor-pointer shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-0.5 active:translate-x-0.5">X</button>
                    </div>
                    <div class="p-4 min-h-[120px] font-bold relative group hidden">
                        <div class="focus:outline-none empty:before:content-[attr(placeholder)] empty:before:text-gray-400 cursor-text w-full h-full min-h-[80px] pb-8 outline-none" contenteditable="true" placeholder="可以添加任何文字和图片">${content}</div>
                        <button onclick="triggerImageUpload(this)" title="插入图片" class="absolute bottom-2 right-2 border-[2px] border-black px-2 py-1 text-xs bg-[#e6f4e8] hover:bg-[#b5e0bb] cursor-pointer transition-colors shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-0.5 active:translate-x-0.5">🖼️ 插入图片</button>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        function addCommand(trigger = '', content = '') {
            const container = document.getElementById('commands-container');
            const html = `
                <div class="command-item border-[3px] border-black bg-white/40 group">
                    <div class="flex justify-between items-center border-b-[3px] border-black px-3 py-1 bg-[#e6f4e8]">
                        <div class="w-2/3 font-bold flex items-center gap-2">
                            <span class="collapse-arrow inline-block transition-transform duration-200 text-sm cursor-pointer px-1 hover:text-gray-500 -rotate-90" onclick="toggleItemContent(this)" title="展开/收起">▼</span>
                            <div class="focus:outline-none empty:before:content-[attr(placeholder)] empty:before:text-gray-500 cursor-text w-full outline-none py-1" contenteditable="true" placeholder="触发词：">${trigger}</div>
                        </div>
                        <button onclick="deleteItem(this, 'command')" title="删除此项" class="border-[2px] border-black w-7 h-7 flex items-center justify-center font-black text-sm bg-white hover:bg-red-500 hover:text-white transition-colors cursor-pointer shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-0.5 active:translate-x-0.5">X</button>
                    </div>
                    <div class="p-4 min-h-[120px] font-bold relative group hidden">
                        <div class="focus:outline-none empty:before:content-[attr(placeholder)] empty:before:text-gray-400 cursor-text w-full h-full min-h-[80px] pb-8 outline-none" contenteditable="true" placeholder="可以添加任何文字和图片">${content}</div>
                        <button onclick="triggerImageUpload(this)" title="插入图片" class="absolute bottom-2 right-2 border-[2px] border-black px-2 py-1 text-xs bg-[#e6f4e8] hover:bg-[#b5e0bb] cursor-pointer transition-colors shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-0.5 active:translate-x-0.5">🖼️ 插入图片</button>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        function addTextItem(containerId, content = '', placeholder = '') {
            const container = document.getElementById(containerId);
            const index = container.children.length + 1;
            const displayContent = content ? content.replace(/\n*$/, '') + '\n\n' : '';
            const html = `
                <div class="text-item border-[3px] border-black bg-white/40 group">
                    <div class="flex justify-between items-center border-b-[3px] border-black px-3 py-1.5 bg-[#e6f4e8]">
                        <div class="flex items-center gap-2">
                            <span class="collapse-arrow inline-block transition-transform duration-200 text-sm cursor-pointer px-1 hover:text-gray-500 -rotate-90" onclick="toggleItemContent(this)" title="展开/收起">▼</span>
                            <span class="font-black text-base item-index">${index}.</span>
                        </div>
                        <button onclick="deleteTextItem(this)" title="删除此项" class="border-[2px] border-black w-7 h-7 flex items-center justify-center font-black text-sm bg-white hover:bg-red-500 hover:text-white transition-colors cursor-pointer shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-0.5 active:translate-x-0.5">X</button>
                    </div>
                    <div class="p-4 font-bold relative hidden">
                        <textarea class="w-full min-h-[80px] bg-transparent outline-none resize-y font-bold" placeholder="${placeholder}">${displayContent}</textarea>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        window.onload = function () {
            addPhrase();
            addCommand();
            addTextItem('paimian-container', '', '请输入排面模板内容 (支持多行，可用变量 名字、金额)');
            addTextItem('huaka-container', '', '请输入划卡模板内容 (支持多行，可用变量 会员1、接待1、金额1、时间1)');
            addTextItem('shield-container', '', '请输入需要拦截的屏蔽词...');

            const urlParams = new URLSearchParams(window.location.search);
            const groupIdFromUrl = urlParams.get('group');

            currentToken = urlParams.get('token');

            if (groupIdFromUrl) {
                document.getElementById('group-id-input').value = groupIdFromUrl;
                setTimeout(() => {
                    fetchServerData();
                }, 500);
            }

            const pasteZone = document.getElementById('laxian-paste-zone');
            if (pasteZone) {
                pasteZone.addEventListener('paste', function (e) {
                    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf("image") !== -1) {
                            e.preventDefault();
                            const file = items[i].getAsFile();
                            const reader = new FileReader();
                            reader.onload = function (event) {
                                const previewDiv = document.getElementById('laxian-preview');
                                previewDiv.innerHTML = `<img src="${event.target.result}" style="max-height: 250px; border: 4px solid black;">`;
                                document.getElementById('laxian-btn-text').innerText = "更换GIF";
                                document.getElementById('laxian-clear-btn').classList.remove('hidden');
                            };
                            reader.readAsDataURL(file);
                            break;
                        }
                    }
                });
            }
        };

        function showMessage(msg) {
            document.getElementById('message-text').innerText = msg;
            document.getElementById('message-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('message-modal').classList.add('hidden'); }

        async function loadDataToUI(data) {
            globalOriginalData = { ...globalOriginalData, ...data };
            initialFilePaths.clear();

            document.getElementById('phrases-container').innerHTML = '';
            document.getElementById('commands-container').innerHTML = '';
            document.getElementById('paimian-container').innerHTML = '';
            document.getElementById('huaka-container').innerHTML = '';
            document.getElementById('shield-container').innerHTML = '';

            const collectFiles = (segments) => {
                if (Array.isArray(segments)) {
                    segments.forEach(s => { if (s.type === 'image') initialFilePaths.add(s.file); });
                }
            };

            if (data.preset_lines && Array.isArray(data.preset_lines)) {
                data.preset_lines.forEach(lineSegments => {
                    collectFiles(lineSegments);
                    addPhrase(formatSegmentsToHtml(lineSegments));
                });
            }
            if (document.getElementById('phrases-container').children.length === 0) addPhrase();

            if (data.custom_commands && typeof data.custom_commands === 'object') {
                Object.entries(data.custom_commands).forEach(([trigger, segments]) => {
                    collectFiles(segments);
                    addCommand(trigger, formatSegmentsToHtml(segments));
                });
            }
            if (document.getElementById('commands-container').children.length === 0) addCommand();

            if (data.paimian_lines && Array.isArray(data.paimian_lines)) {
                data.paimian_lines.forEach(item => addTextItem('paimian-container', item, '请输入排面模板内容 (支持多行，可用变量 名字、金额)'));
            }
            if (document.getElementById('paimian-container').children.length === 0) addTextItem('paimian-container', '', '请输入排面模板内容 (支持多行，可用变量 名字、金额)');

            if (data.huaka_lines && Array.isArray(data.huaka_lines)) {
                data.huaka_lines.forEach(item => addTextItem('huaka-container', item, '请输入划卡模板内容 (支持多行，可用变量如 会员1、接待1、金额1、时间1)'));
            }
            if (document.getElementById('huaka-container').children.length === 0) addTextItem('huaka-container', '', '请输入划卡模板内容 (支持多行，可用变量如 会员1、接待1、金额1、时间1)');

            if (data.shield_words && Array.isArray(data.shield_words)) {
                data.shield_words.forEach(item => addTextItem('shield-container', item, '请输入需要拦截的屏蔽词...'));
            }
            if (document.getElementById('shield-container').children.length === 0) addTextItem('shield-container', '', '请输入需要拦截的屏蔽词...');

            if (data.laxian_gifs && data.laxian_gifs.length > 0) {
                const laxianPath = data.laxian_gifs[0];
                initialFilePaths.add(laxianPath);
                const previewDiv = document.getElementById('laxian-preview');
                previewDiv.innerHTML = `<img src="${API_BASE_URL}/activity/${laxianPath}" data-original-file="${laxianPath}" style="max-height: 250px; border: 4px solid black;">`;
                document.getElementById('laxian-btn-text').innerText = "更换GIF";
                document.getElementById('laxian-clear-btn').classList.remove('hidden');
            } else {
                clearLaxian();
            }
        }

        function formatSegmentsToHtml(segments) {
            if (!segments || !Array.isArray(segments)) { return typeof segments === 'string' ? segments : ''; }
            let html = '';
            segments.forEach(seg => {
                if (seg.type === 'text') {
                    html += seg.text.replace(/\n/g, '<br>');
                } else if (seg.type === 'image') {
                    html += `<img src="${API_BASE_URL}/activity/${seg.file}" data-original-file="${seg.file}">`;
                }
            });
            if (html !== '') {
                html += '<br><br>';
            }
            return html;
        }

        async function fetchServerData() {
            const groupId = document.getElementById('group-id-input').value.trim();
            if (!groupId) {
                showMessage('请先输入要拉取配置的群号！');
                return;
            }

            showMessage('正在从服务器获取当前配置，请稍候...');

            try {
                const response = await fetch(`${API_BASE_URL}/api/data/${groupId}`, {
                    method: 'GET',
                    headers: {
                        'X-Token': currentToken || ""
                    }
                });

                if (response.status === 403) {
                    showMessage('⛔ 访问口令已失效或未授权！\n请在 QQ 群内重新发送“本群状态”获取新链接。');
                    return;
                }

                if (response.status === 404) {
                    showMessage(`这是个新群，还没有历史配置哦，请直接开始添加。`);
                    return;
                }
                if (!response.ok) throw new Error("网络响应错误");

                const data = await response.json();
                await loadDataToUI(data);

                showMessage('成功拉取该群现有配置！\n现在您可以继续修改了。');
            } catch (error) {
                console.error(error);
                showMessage('拉取失败，请检查小小糕的隧道是否在线。');
            }
        }

        function extractTextArray(containerId) {
            const arr = [];
            const textareas = document.querySelectorAll(`#${containerId} .text-item textarea`);
            textareas.forEach(ta => {
                const val = ta.value.trim();
                if (val !== '') {
                    arr.push(val);
                }
            });
            return arr;
        }

        async function submitData() {
            const groupId = document.getElementById('group-id-input').value.trim();
            if (!groupId) { showMessage('请先输入群号！'); return; }

            showMessage('正在打包并发送数据到服务器，请稍候...');

            const formData = new FormData();
            formData.append('group_id', groupId);

            const preset_lines = [];
            const custom_commands = {};
            usedFilePaths.clear();
            let imageIndex = 0;

            async function processContent(element, type) {
                let segments = [];
                let currentText = "";

                async function traverse(node) {
                    if (node.nodeType === Node.TEXT_NODE) {
                        currentText += node.textContent;
                    } else if (node.nodeType === Node.ELEMENT_NODE) {
                        const tag = node.tagName.toLowerCase();
                        if (tag === 'br') { currentText += "\n"; }
                        else if (tag === 'img') {
                            if (currentText) {
                                segments.push({ type: "text", text: currentText });
                                currentText = "";
                            }
                            const srcAttr = node.getAttribute('src');
                            let filePath = "";

                            // 💡 终极移动端防线：强制转为合规的 File 对象并严格兜底后缀
                            if (srcAttr && srcAttr.startsWith('data:image')) {
                                const mimeType = srcAttr.substring(5, srcAttr.indexOf(';'));
                                let ext = 'jpg';
                                if (mimeType.includes('png')) ext = 'png';
                                else if (mimeType.includes('gif')) ext = 'gif';
                                else if (mimeType.includes('webp')) ext = 'webp';

                                const fileName = `${type}_${Date.now()}_${imageIndex++}.${ext}`;
                                filePath = `${groupId}/${type}/${fileName}`;

                                // 直接 fetch 读取 DataURL，完美避开 JS 堆内存爆炸
                                const res = await fetch(srcAttr);
                                const imageBlob = await res.blob();

                                let imageFileObj;
                                try {
                                    imageFileObj = new File([imageBlob], fileName, { type: mimeType });
                                } catch (e) {
                                    imageFileObj = imageBlob; // 移动端直接传递纯净的 Blob 实例兜底
                                }

                                // 传入最纯净的 fileName，抹平双端解析斜杠差异
                                formData.append('new_images', imageFileObj, fileName);
                                node.setAttribute('src', `${API_BASE_URL}/activity/${filePath}`);
                                node.setAttribute('data-original-file', filePath);
                            }
                            else if (node.hasAttribute('data-original-file')) {
                                filePath = node.getAttribute('data-original-file');
                            }

                            if (filePath) {
                                segments.push({ type: "image", file: filePath });
                                usedFilePaths.add(filePath);
                            }
                        } else {
                            const isBlock = tag === 'div' || tag === 'p';
                            if (isBlock && currentText && !currentText.endsWith('\n')) currentText += '\n';
                            for (let child of node.childNodes) await traverse(child);
                            if (isBlock && currentText && !currentText.endsWith('\n')) currentText += '\n';
                        }
                    }
                }

                for (let child of element.childNodes) await traverse(child);
                if (currentText) segments.push({ type: "text", text: currentText });

                if (segments.length > 0) {
                    if (segments[0].type === 'text') {
                        segments[0].text = segments[0].text.trimStart();
                    }
                    if (segments[segments.length - 1].type === 'text') {
                        segments[segments.length - 1].text = segments[segments.length - 1].text.trimEnd();
                    }
                }

                return segments.filter(s => !(s.type === 'text' && s.text === ''));
            }

            try {
                const phraseDivs = document.querySelectorAll('#phrases-container .phrase-item div[contenteditable="true"]');
                for (const div of phraseDivs) {
                    if (div.innerText.trim() !== '' || div.querySelector('img')) {
                        const segs = await processContent(div, 'line');
                        if (segs.length > 0) preset_lines.push(segs);
                    }
                }

                const commandRows = document.querySelectorAll('#commands-container .command-item');
                for (const row of commandRows) {
                    const editables = row.querySelectorAll('div[contenteditable]');
                    if (editables.length === 2) {
                        const triggerText = editables[0].innerText.trim();
                        if (triggerText !== '') {
                            const segs = await processContent(editables[1], 'cmd');
                            if (segs.length > 0) custom_commands[triggerText] = segs;
                        }
                    }
                }

                const paimian_lines = extractTextArray('paimian-container');
                const huaka_lines = extractTextArray('huaka-container');
                const shield_words = extractTextArray('shield-container');

                const newLaxianGifs = [];
                const laxianPreviewDiv = document.getElementById('laxian-preview');
                const laxianImg = laxianPreviewDiv.querySelector('img');

                if (laxianImg) {
                    const srcAttr = laxianImg.getAttribute('src');
                    let filePath = "";
                    if (srcAttr.startsWith('data:image')) {
                        const mimeType = srcAttr.substring(5, srcAttr.indexOf(';'));
                        let ext = 'gif';
                        if (mimeType.includes('jpg') || mimeType.includes('jpeg')) ext = 'jpg';
                        else if (mimeType.includes('png')) ext = 'png';
                        else if (mimeType.includes('webp')) ext = 'webp';

                        const fileName = `laxian_${Date.now()}_${imageIndex++}.${ext}`;
                        filePath = `${groupId}/laxian/${fileName}`;

                        const res = await fetch(srcAttr);
                        const imageBlob = await res.blob();

                        let imageFileObj;
                        try {
                            imageFileObj = new File([imageBlob], fileName, { type: mimeType });
                        } catch (e) {
                            imageFileObj = imageBlob;
                        }

                        formData.append('new_images', imageFileObj, fileName);
                        laxianImg.setAttribute('data-original-file', filePath);
                        usedFilePaths.add(filePath);
                    } else if (laxianImg.hasAttribute('data-original-file')) {
                        filePath = laxianImg.getAttribute('data-original-file');
                        usedFilePaths.add(filePath);
                    }
                    if (filePath) { newLaxianGifs.push(filePath); }
                }

                globalOriginalData.preset_lines = preset_lines;
                globalOriginalData.custom_commands = custom_commands;
                globalOriginalData.paimian_lines = paimian_lines;
                globalOriginalData.huaka_lines = huaka_lines;
                globalOriginalData.shield_words = shield_words;
                globalOriginalData.laxian_gifs = newLaxianGifs;

                formData.append('json_data', JSON.stringify(globalOriginalData));

                const filesToDelete = [];
                for (const path of initialFilePaths) {
                    if (!usedFilePaths.has(path)) { filesToDelete.push(path); }
                }
                formData.append('deleted_images', JSON.stringify(filesToDelete));

                const response = await fetch(`${API_BASE_URL}/api/upload`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Token': currentToken || ""
                    }
                });

                if (response.status === 403) {
                    showMessage("⛔ 提交失败：此安全链接已过期作废！\n为保护数据安全，请在群内重新获取。");
                    return;
                }

                if (!response.ok) throw new Error(`服务器响应错误: ${response.status}`);

                initialFilePaths = new Set(usedFilePaths);
                const deleteMsg = filesToDelete.length > 0 ? ` 并清理了 ${filesToDelete.length} 张废弃图片。` : "。";
                showMessage(`保存成功！\n数据已同步到服务器${deleteMsg}\n\n👉 提示：请在QQ群内发送【重载数据】使新配置生效！`);

            } catch (err) {
                console.error(err);
                showMessage(`同步失败，请检查服务器网络连接：\n${err.message}`);
            }
        }
    </script>
