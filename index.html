<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [contenteditable] {
            word-break: break-word;
        }

        [contenteditable] img {
            max-width: 150px;
            max-height: 150px;
            display: inline-block;
            margin: 4px;
            border: 2px solid #e5e7eb;
            vertical-align: middle;
        }
    </style>
</head>

<body class="min-h-screen py-12 px-4 sm:px-6 lg:px-8 font-sans text-black flex justify-center">
    <video autoplay loop muted playsinline class="fixed inset-0 w-full h-full object-cover z-[-10]">
        <source src="background.mp4" type="video/mp4">
        您的浏览器不支持 HTML5 视频。
    </video>

    <div class="w-full max-w-3xl border-[4px] border-black bg-white/10 backdrop-blur-sm p-8 sm:p-12 shadow-xl">

        <div class="mb-12 border-[4px] border-black flex flex-col sm:flex-row items-center p-4 bg-[#e6f4e8] gap-4">
            <div class="flex items-center w-full">
                <span class="font-bold text-2xl mr-2 whitespace-nowrap text-gray-800">当前管理群号：</span>
                <input type="text" id="group-id-input" readonly placeholder="未绑定群号"
                    class="w-full text-2xl font-black outline-none bg-transparent text-gray-700 cursor-default select-none tracking-wide">
            </div>
        </div>

        <div class="flex gap-3 mb-8">
            <button id="config-tab" onclick="switchPage('config')" class="border-[3px] border-black px-4 py-2 font-bold bg-[#e6f4e8]">群配置</button>
            <button id="gmk-tab" onclick="switchPage('gmk')" class="border-[3px] border-black px-4 py-2 font-bold bg-white">冠名卡管理</button>
            <button id="settings-tab" onclick="switchPage('settings')" class="border-[3px] border-black px-4 py-2 font-bold bg-white">群设置</button>
        </div>

        <div id="config-page">

        <p class="text-center font-bold text-red-500 mb-8 tracking-wider">目前不支持苹果用户上传图片</p>

        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider cursor-pointer select-none"
                onclick="toggleSection('phrases-container', this)">
                短句列表：<span class="inline-block transition-transform duration-200 text-sm -rotate-90">▼</span>
            </h2>
            <div id="phrases-container" class="space-y-6 mb-6 hidden"></div>
            <div class="flex items-start hidden">
                <button onclick="addPhrase()"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]">
                    <span class="mb-2 tracking-wide">点击添加新的短句</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider cursor-pointer select-none"
                onclick="toggleSection('commands-container', this)">
                指令列表：<span class="inline-block transition-transform duration-200 text-sm -rotate-90">▼</span>
            </h2>
            <div id="commands-container" class="space-y-6 mb-6 hidden"></div>
            <div class="flex items-start hidden">
                <button onclick="addCommand()"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]">
                    <span class="mb-2 tracking-wide">点击添加新的指令</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider cursor-pointer select-none"
                onclick="toggleSection('paimian-container', this)">
                排面模板列表：<span class="inline-block transition-transform duration-200 text-sm -rotate-90">▼</span>
            </h2>
            <div id="paimian-container" class="space-y-6 mb-6 hidden"></div>
            <div class="flex items-start hidden">
                <button onclick="addTextItem('paimian-container', '', '请输入排面模板内容 (支持多行，可用变量如 名字、金额)...')"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]">
                    <span class="mb-2 tracking-wide">点击添加新排面模板</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider cursor-pointer select-none"
                onclick="toggleSection('huaka-container', this)">
                划卡模板列表：<span class="inline-block transition-transform duration-200 text-sm -rotate-90">▼</span>
            </h2>
            <div id="huaka-container" class="space-y-6 mb-6 hidden"></div>
            <div class="flex items-start hidden">
                <button onclick="addTextItem('huaka-container', '', '请输入划卡模板内容 (支持多行，可用变量如 会员1、接待1、金额1)...')"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]">
                    <span class="mb-2 tracking-wide">点击添加新划卡模板</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <div class="mb-16">
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider cursor-pointer select-none"
                onclick="toggleSection('shield-container', this)">
                屏蔽词列表：<span class="inline-block transition-transform duration-200 text-sm -rotate-90">▼</span>
            </h2>
            <div id="shield-container" class="space-y-6 mb-6 hidden"></div>
            <div class="flex items-start hidden">
                <button onclick="addTextItem('shield-container', '', '请输入需要拦截的屏蔽词...')"
                    class="grow border-[3px] border-black p-4 font-bold flex flex-col items-center justify-center hover:bg-[#b5e0bb] transition-colors cursor-pointer w-full bg-[#e6f4e8]">
                    <span class="mb-2 tracking-wide">点击添加新屏蔽词</span>
                    <span class="text-3xl leading-none font-black">+</span>
                </button>
            </div>
        </div>

        <div>
            <h2 class="text-center font-bold text-xl mb-8 tracking-wider">拉线GIF (添加之后才能触发‘呼叫客服’)：</h2>
            <div id="laxian-paste-zone" tabindex="0"
                class="flex flex-col items-center justify-center border-[3px] border-black p-8 bg-[#e6f4e8] relative min-h-[200px] outline-none">
                <div id="laxian-preview" class="mb-6 empty:hidden flex justify-center w-full"></div>
                <div class="flex gap-4">
                    <button onclick="triggerLaxianUpload()"
                        class="border-[3px] border-black p-3 font-bold hover:bg-[#b5e0bb] transition-colors cursor-pointer bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1">
                        <span id="laxian-btn-text">点击上传/粘贴更换GIF</span>
                    </button>
                    <button onclick="clearLaxian()" id="laxian-clear-btn"
                        class="hidden border-[3px] border-black p-3 font-bold bg-red-400 hover:bg-red-500 text-white transition-colors cursor-pointer shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1">
                        删除当前图片
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-16 flex flex-col sm:flex-row justify-center gap-6">
            <button onclick="submitData()"
                class="border-[4px] border-black bg-black text-white px-12 py-4 text-2xl font-bold tracking-widest hover:bg-gray-800 transition-all cursor-pointer shadow-[8px_8px_0px_0px_rgba(0,0,0,0.2)] active:shadow-none active:translate-y-2 active:translate-x-2">保存提交</button>
        </div>

        </div>

        <div id="settings-page" class="hidden space-y-10">
            <section class="border-[3px] border-black bg-white/80 p-6">
                <h2 class="text-xl font-black mb-2">冠名卡有效期</h2>
                <p class="text-sm font-bold text-gray-600 mb-4">设置冠名卡保存多久；填写 0 表示永久有效。</p>
                <label class="font-bold block mb-2" for="gmk-expire-days">有效期（天）</label>
                <input id="gmk-expire-days" type="number" min="0" step="1" value="0" class="w-full border-[3px] border-black p-3 font-bold bg-white" required>
            </section>

            <section class="border-[3px] border-black bg-white/80 p-6">
                <h2 class="text-xl font-black mb-2">贵宾欢迎</h2>
                <p class="text-sm font-bold text-gray-600 mb-6">仅影响进阶版群；个人关闭贵宾欢迎、原有 4 小时冷却规则仍然生效。</p>

                <label class="font-bold block mb-2" for="vip-welcome-threshold">累计消费门槛</label>
                <input id="vip-welcome-threshold" type="number" min="0" step="1" value="2000" class="w-full border-[3px] border-black p-3 font-bold bg-white mb-6" required>

                <label class="font-bold block mb-2" for="vip-welcome-message">欢迎话术</label>
                <textarea id="vip-welcome-message" rows="4" class="w-full border-[3px] border-black p-3 font-bold bg-white resize-y" required>【贵宾专属】欢迎贵宾 {昵称}，累计消费{累计消费}元！</textarea>
                <p class="text-sm font-bold text-gray-600 mt-2 mb-6">请勿删除，这两个分别会显示名字跟消费金额：<code>{昵称}</code>、<code>{累计消费}</code>。</p>

                <div class="border-t-[2px] border-black pt-6">
                    <h3 class="font-black text-lg mb-2">欢迎 GIF</h3>
                    <p id="vip-welcome-gif-status" class="text-sm font-bold text-gray-600 mb-4">正在加载当前 GIF…</p>
                    <div id="vip-welcome-gif-preview" class="min-h-[160px] flex items-center justify-center border-[3px] border-black bg-[#e6f4e8] p-4 mb-4"></div>
                    <div class="flex flex-wrap gap-3">
                        <button type="button" onclick="document.getElementById('vip-welcome-gif-upload').click()" class="border-[2px] border-black p-3 font-bold bg-white">上传 / 替换 GIF</button>
                        <button type="button" onclick="resetVipWelcomeGif()" class="border-[2px] border-black p-3 font-bold bg-red-300">恢复默认 GIF</button>
                    </div>
                </div>
            </section>

            <div class="flex justify-center">
                <button onclick="submitData()" class="border-[4px] border-black bg-black text-white px-12 py-4 text-xl font-bold tracking-widest">保存提交全部改动</button>
            </div>
        </div>

        <div id="gmk-page" class="hidden">
            <div class="border-[3px] border-black bg-[#e6f4e8] p-5 mb-6">
                <h2 class="text-xl font-black mb-3">冠名卡管理</h2>
                <div class="flex gap-3">
                    <input id="gmk-search" oninput="renderGmkObjects()" placeholder="搜索 QQ 号" class="grow border-[2px] border-black p-2 bg-white font-bold">
                    <button onclick="promptGmkUser()" class="border-[2px] border-black px-3 font-bold bg-white">添加对象</button>
                </div>
                <p id="gmk-status" class="text-sm font-bold mt-3">切换到本页后加载拥有冠名卡的对象。</p>
            </div>
            <div id="gmk-objects" class="space-y-3"></div>
            <div class="mt-12 flex justify-center">
                <button onclick="submitData()" class="border-[4px] border-black bg-black text-white px-12 py-4 text-xl font-bold tracking-widest">保存提交全部改动</button>
            </div>
        </div>

    </div>

    <input type="file" id="image-upload" accept="image/jpeg, image/png, image/gif, image/webp" multiple class="hidden"
        onchange="handleImageUpload(event)">
    <input type="file" id="laxian-upload" accept="image/gif, image/jpeg, image/png, image/webp" class="hidden"
        onchange="handleLaxianUpload(event)">
    <input type="file" id="vip-welcome-gif-upload" accept="image/gif" class="hidden" onchange="handleVipWelcomeGifUpload(event)">

    <div id="message-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white/10 backdrop-blur-sm border-[4px] border-black p-8 max-w-sm w-full mx-4 shadow-xl">
            <p id="message-text" class="text-xl font-bold mb-8 text-center whitespace-pre-line"></p>
            <button onclick="closeModal()"
                class="w-full border-[3px] border-black bg-[#e6f4e8] p-3 font-bold hover:bg-[#b5e0bb] transition-colors">确定</button>
        </div>
    </div>

    <div id="verify-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white border-[4px] border-black p-8 max-w-sm w-full mx-4 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
            <h3 class="text-2xl font-black mb-2 text-center tracking-wider">🔒 安全身份验证</h3>
            <p class="text-xs font-bold text-gray-500 mb-6 text-center">请输入机器人私聊发送给您的专属身份验证码</p>
            <div class="mb-6">
                <input type="text" id="verify-code-input" placeholder="请输入验证码..." maxlength="10"
                    class="w-full border-[3px] border-black p-3 text-center text-2xl font-black tracking-widest outline-none focus:bg-[#e6f4e8] transition-colors uppercase">
            </div>
            <button onclick="submitVerifyCode()"
                class="w-full border-[3px] border-black bg-[#e6f4e8] p-3 font-bold hover:bg-[#b5e0bb] transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1 text-lg">
                校验并进入系统
            </button>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://api.xiaoxiaogao.xyz";
        let currentToken = "";
        let gmkObjects = [];
        const gmkStates = new Map();
        let gmkLoaded = false;
        let gmkSettingsLoaded = false;
        let vipWelcomeGifAction = 'keep';
        let vipWelcomeGifFile = null;
        let vipWelcomeGifPreviewUrl = null;

        let globalOriginalData = {
            "mode": "pro", "super_admins": [], "kefus": [], "online_kefus": [],
            "preset_lines": [], "custom_commands": {}, "paimian_lines": [],
            "huaka_lines": [], "laxian_gifs": [], "shield_words": []
        };

        let initialFilePaths = new Set();
        let usedFilePaths = new Set();
        let currentEditTarget = null;
        let lastKnownRange = null;
        let savedRange = null;

        document.addEventListener('selectionchange', () => {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                let container = range.commonAncestorContainer;
                if (container.nodeType === Node.TEXT_NODE) {
                    container = container.parentElement;
                }
                if (container && container.closest && container.closest('[contenteditable="true"]')) {
                    lastKnownRange = range.cloneRange();
                }
            }
        });

        let dragSrcEl = null;

        document.addEventListener('mousedown', function (e) {
            const handle = e.target.closest('.drag-handle');
            if (handle && !e.target.closest('button') && !e.target.closest('.collapse-arrow')) {
                const item = handle.closest('.phrase-item');
                if (item) item.setAttribute('draggable', 'true');
            }
        });

        document.addEventListener('mouseup', function (e) {
            document.querySelectorAll('.phrase-item[draggable="true"]').forEach(item => {
                item.setAttribute('draggable', 'false');
            });
        });

        let touchDragSrcEl = null;

        document.addEventListener('touchstart', function (e) {
            const handle = e.target.closest('.drag-handle');
            if (handle && !e.target.closest('button') && !e.target.closest('.collapse-arrow')) {
                const item = handle.closest('.phrase-item');
                if (item) {
                    touchDragSrcEl = item;
                    setTimeout(() => item.classList.add('opacity-40', 'scale-[0.98]'), 0);
                }
            }
        }, { passive: false });

        document.addEventListener('touchmove', function (e) {
            if (!touchDragSrcEl) return;
            e.preventDefault();

            const touch = e.touches[0];
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!targetEl) return;

            const targetItem = targetEl.closest('.phrase-item');
            if (targetItem && targetItem !== touchDragSrcEl && touchDragSrcEl.parentNode.contains(targetItem)) {
                const rect = targetItem.getBoundingClientRect();
                const next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                const container = touchDragSrcEl.parentNode;
                container.insertBefore(touchDragSrcEl, next ? targetItem.nextSibling : targetItem);
                
                const indices = container.querySelectorAll('.phrase-index');
                indices.forEach((el, idx) => { el.innerText = (idx + 1) + '.'; });
            }
        }, { passive: false });

        document.addEventListener('touchend', function (e) {
            if (touchDragSrcEl) {
                touchDragSrcEl.classList.remove('opacity-40', 'scale-[0.98]');
                touchDragSrcEl = null;
            }
        });

        document.addEventListener('touchcancel', function (e) {
            if (touchDragSrcEl) {
                touchDragSrcEl.classList.remove('opacity-40', 'scale-[0.98]');
                touchDragSrcEl = null;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const phrasesContainer = document.getElementById('phrases-container');

            phrasesContainer.addEventListener('dragstart', function (e) {
                const item = e.target.closest('.phrase-item');
                if (item) {
                    dragSrcEl = item;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', '');
                    setTimeout(() => item.classList.add('opacity-40', 'scale-[0.98]'), 0);
                }
            });

            phrasesContainer.addEventListener('dragover', function (e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                
                const targetItem = e.target.closest('.phrase-item');
                if (targetItem && targetItem !== dragSrcEl) {
                    const rect = targetItem.getBoundingClientRect();
                    const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    phrasesContainer.insertBefore(dragSrcEl, next ? targetItem.nextSibling : targetItem);
                    
                    const indices = phrasesContainer.querySelectorAll('.phrase-index');
                    indices.forEach((el, idx) => { el.innerText = (idx + 1) + '.'; });
                }
            });

            phrasesContainer.addEventListener('dragend', function (e) {
                if (dragSrcEl) {
                    dragSrcEl.classList.remove('opacity-40', 'scale-[0.98]');
                    dragSrcEl.setAttribute('draggable', 'false');
                    dragSrcEl = null;
                }
            });
        });

        document.addEventListener('paste', function (e) {
            const target = e.target;
            if (target.closest('[contenteditable="true"]')) {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        e.preventDefault();
                        const file = items[i].getAsFile();
                        const reader = new FileReader();
                        reader.onload = function (event) {
                            document.execCommand('insertImage', false, event.target.result);
                        };
                        reader.readAsDataURL(file);
                        break;
                    }
                }
            }
        });

        function toggleItemContent(btnElement) {
            const item = btnElement.closest('.phrase-item, .command-item, .text-item');
            if (item) {
                const content = item.querySelector('.p-4');
                if (content) content.classList.toggle('hidden');
                btnElement.classList.toggle('-rotate-90');
            }
        }

        function toggleSection(containerId, headerElement) {
            const container = document.getElementById(containerId);
            container.classList.toggle('hidden');

            if (container.nextElementSibling) {
                container.nextElementSibling.classList.toggle('hidden');
            }

            const arrow = headerElement.querySelector('span');
            if (arrow) {
                arrow.classList.toggle('-rotate-90');
            }
        }

        function triggerImageUpload(btnElement) {
            currentEditTarget = btnElement.previousElementSibling;
            if (lastKnownRange && currentEditTarget.contains(lastKnownRange.commonAncestorContainer)) {
                savedRange = lastKnownRange.cloneRange();
            } else {
                savedRange = null;
            }
            document.getElementById('image-upload').click();
        }

        async function handleImageUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0 || !currentEditTarget) return;

            if (!savedRange) {
                savedRange = document.createRange();
                savedRange.selectNodeContents(currentEditTarget);
                savedRange.collapse(false);
            }

            savedRange.deleteContents();

            const promises = Array.from(files).map(file => {
                return new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            });

            const results = await Promise.all(promises);
            const frag = document.createDocumentFragment();

            results.forEach((src, idx) => {
                const img = document.createElement('img');
                img.src = src;
                frag.appendChild(img);

                if (idx === results.length - 1) {
                    frag.appendChild(document.createElement('br'));
                    frag.appendChild(document.createElement('br'));
                }
            });

            savedRange.insertNode(frag);

            currentEditTarget.focus();
            savedRange.collapse(false);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);

            currentEditTarget = null;
            savedRange = null;
            event.target.value = '';
        }
        
        function triggerLaxianUpload() { document.getElementById('laxian-upload').click(); }

        function handleLaxianUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const previewDiv = document.getElementById('laxian-preview');
                previewDiv.innerHTML = `<img src="${e.target.result}" style="max-height: 250px; border: 4px solid black;">`;
                document.getElementById('laxian-btn-text').innerText = "更换GIF";
                document.getElementById('laxian-clear-btn').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function clearLaxian() {
            document.getElementById('laxian-preview').innerHTML = '';
            document.getElementById('laxian-btn-text').innerText = "点击上传/粘贴更换GIF";
            document.getElementById('laxian-clear-btn').classList.add('hidden');
        }

        function deleteItem(btnElement, type) {
            const itemRow = btnElement.closest('.phrase-item, .command-item');
            if (itemRow) {
                itemRow.remove();
                if (type === 'phrase') {
                    const indices = document.querySelectorAll('.phrase-index');
                    indices.forEach((el, idx) => { el.innerText = (idx + 1) + '.'; });
                }
            }
        }

        function deleteTextItem(btnElement) {
            const itemRow = btnElement.closest('.text-item');
            if (itemRow) {
                const container = itemRow.parentElement;
                itemRow.remove();
                const indices = container.querySelectorAll('.item-index');
                indices.forEach((el, idx) => { el.innerText = (idx + 1) + '.'; });
            }
        }

        function addPhrase(content = '') {

        // 💡 页面初始化逻辑：拦截并拦截出验证码校验框
        window.onload = function () {
            addPhrase();
            addCommand();
            addTextItem('paimian-container', '', '请输入排面模板内容 (支持多行，可用变量 名字、金额)');
            addTextItem('huaka-container', '', '请输入划卡模板内容 (支持多行，可用变量如 会员1、接待1、金额1、时间1)');

        // 💡 新增：处理验证码提交
        function submitVerifyCode() {
            const verifyCode = document.getElementById('verify-code-input').value.trim();
            if (!verifyCode) {
                alert('请输入身份验证码！');
                return;

        // 💡 修改：静默调用后端，携带验证码安全请求配置数据
        async function fetchServerData(verifyCode) {
            const groupId = document.getElementById('group-id-input').value.trim();
            if (!groupId) return;

            showMessage('正在安全验证并从服务器加载现有配置，请稍候...');

            try {
                const response = await fetch(`${API_BASE_URL}/api/data/${groupId}`, {
                    method: 'GET',
                    headers: {
                        'X-Token': currentToken || "",
                        'X-Verify-Code': verifyCode || ""  // 💡 安全验证码封装进请求头
                    }
                });

                if (response.status === 403) {
                    showMessage('⛔ 安全认证失败！\n验证码不正确、管理链接已作废或无权访问。\n请在 QQ 群内重新发送“本群状态”获取新链接。');
                    return;
                }

                if (response.status === 404) {
                    // 认证成功，但为新群
                    document.getElementById('verify-modal').classList.add('hidden');
                    showMessage(`验证通过！\n这是一个全新的群，还没有历史配置，请直接开始创建。`);
                    return;
                }
                if (!response.ok) throw new Error("网络响应错误");

                const data = await response.json();
                await loadDataToUI(data);
                await loadGmkSettings();

                // 💡 验证成功，解锁并隐藏验证码窗口
                document.getElementById('verify-modal').classList.add('hidden');
                showMessage('验证通过！成功同步该群现有配置。');
            } catch (error) {
                console.error(error);
                showMessage('同步加载失败，请检查服务器网络或隧道连接状态。');
            }
        }

        function showMessage(msg) {
            document.getElementById('message-text').innerText = msg;
            document.getElementById('message-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('message-modal').classList.add('hidden'); }

        function switchPage(page) {
            const isGmk = page === 'gmk';
            const isSettings = page === 'settings';
            document.getElementById('config-page').classList.toggle('hidden', page !== 'config');
            document.getElementById('gmk-page').classList.toggle('hidden', !isGmk);
            document.getElementById('settings-page').classList.toggle('hidden', !isSettings);
            document.getElementById('config-tab').className = `border-[3px] border-black px-4 py-2 font-bold ${page === 'config' ? 'bg-[#e6f4e8]' : 'bg-white'}`;
            document.getElementById('gmk-tab').className = `border-[3px] border-black px-4 py-2 font-bold ${isGmk ? 'bg-[#e6f4e8]' : 'bg-white'}`;
            document.getElementById('settings-tab').className = `border-[3px] border-black px-4 py-2 font-bold ${isSettings ? 'bg-[#e6f4e8]' : 'bg-white'}`;
            if (isGmk && !gmkLoaded && currentToken) loadGmkObjects();
            if (isSettings && !gmkSettingsLoaded && currentToken) loadGmkSettings();
        }

        async function gmkFetch(path) {
            const response = await fetch(`${API_BASE_URL}${path}`, { headers: { 'X-Token': currentToken || '' } });
            if (!response.ok) throw new Error(response.status === 403 ? '管理链接已失效' : '冠名卡数据加载失败');
            return response;
        }

        function renderVipWelcomeGif(url, usingDefault, label = '') {
            const preview = document.getElementById('vip-welcome-gif-preview');
            preview.innerHTML = '';
            const image = document.createElement('img');
            image.src = url;
            image.alt = '贵宾欢迎 GIF 预览';
            image.className = 'max-h-[250px] max-w-full border-[2px] border-black bg-white';
            image.onerror = () => { preview.innerText = 'GIF 预览加载失败；保存后机器人会自动回退默认 GIF。'; };
            preview.appendChild(image);
            document.getElementById('vip-welcome-gif-status').innerText = label || (usingDefault ? '当前使用默认欢迎 GIF。' : '当前使用本群自定义欢迎 GIF。');
        }

        async function loadGmkSettings() {
            const groupId = document.getElementById('group-id-input').value.trim();
            if (!groupId || !currentToken) return;
            try {
                const response = await gmkFetch(`/api/gmk/${groupId}/settings`);
                const settings = await response.json();
                document.getElementById('gmk-expire-days').value = settings.gmk_expire_days;
                document.getElementById('vip-welcome-threshold').value = settings.vip_welcome_threshold;
                document.getElementById('vip-welcome-message').value = settings.vip_welcome_message;
                vipWelcomeGifAction = 'keep';
                vipWelcomeGifFile = null;
                renderVipWelcomeGif(`${API_BASE_URL}${settings.vip_welcome_gif_url}`, settings.using_default_gif);
                gmkSettingsLoaded = true;
            } catch (error) {
                document.getElementById('vip-welcome-gif-status').innerText = error.message;
            }
        }

        function handleVipWelcomeGifUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.type !== 'image/gif') {
                showMessage('贵宾欢迎图片仅支持 GIF 格式。');
                event.target.value = '';
                return;
            }
            if (vipWelcomeGifPreviewUrl) URL.revokeObjectURL(vipWelcomeGifPreviewUrl);
            vipWelcomeGifPreviewUrl = URL.createObjectURL(file);
            vipWelcomeGifFile = file;
            vipWelcomeGifAction = 'replace';
            renderVipWelcomeGif(vipWelcomeGifPreviewUrl, false, `将替换为：${file.name}`);
            event.target.value = '';
        }

        function resetVipWelcomeGif() {
            if (vipWelcomeGifPreviewUrl) URL.revokeObjectURL(vipWelcomeGifPreviewUrl);
            vipWelcomeGifPreviewUrl = null;
            vipWelcomeGifFile = null;
            vipWelcomeGifAction = 'reset';
            renderVipWelcomeGif(`${API_BASE_URL}/activity/hygl.gif`, true, '保存后将恢复默认欢迎 GIF。');
        }

        function appendGmkSettings(formData) {
            const expireDays = document.getElementById('gmk-expire-days').value.trim();
            const threshold = document.getElementById('vip-welcome-threshold').value.trim();
            const message = document.getElementById('vip-welcome-message').value;
            if (!/^\d+$/.test(expireDays) || !/^\d+$/.test(threshold)) {
                throw new Error('冠名卡有效期和贵宾欢迎门槛必须是非负整数。');
            }
            if (!message.trim()) throw new Error('贵宾欢迎话术不能为空。');
            formData.append('gmk_settings', JSON.stringify({
                gmk_expire_days: expireDays,
                vip_welcome_threshold: threshold,
                vip_welcome_message: message,
                vip_welcome_gif_action: vipWelcomeGifAction
            }));
            if (vipWelcomeGifAction === 'replace' && vipWelcomeGifFile) {
                formData.append('vip_welcome_gif', vipWelcomeGifFile, vipWelcomeGifFile.name);
            }
        }

        async function loadGmkObjects() {
            const status = document.getElementById('gmk-status');
            status.innerText = '正在加载拥有冠名卡的对象…';
            try {
                const response = await gmkFetch(`/api/gmk/${document.getElementById('group-id-input').value}/objects`);
                gmkObjects = (await response.json()).objects || [];
                gmkLoaded = true;
                status.innerText = `已找到 ${gmkObjects.length} 个拥有冠名卡的对象（图片尚未加载）。`;
                renderGmkObjects();
            } catch (error) { status.innerText = error.message; }
        }

        function gmkState(qq) {
            if (!gmkStates.has(qq)) gmkStates.set(qq, { qq, cards: [], loaded: false, changed: false, nextIndex: 1 });
            return gmkStates.get(qq);
        }

        function renderGmkObjects() {
            const container = document.getElementById('gmk-objects');
            const query = document.getElementById('gmk-search').value.trim();
            const rows = gmkObjects.filter(item => item.qq.includes(query)).sort((a, b) => {
                const aCount = gmkStates.get(a.qq)?.loaded ? gmkStates.get(a.qq).cards.filter(card => !card.deleted).length : a.count;
                const bCount = gmkStates.get(b.qq)?.loaded ? gmkStates.get(b.qq).cards.filter(card => !card.deleted).length : b.count;
                return bCount - aCount || a.qq.localeCompare(b.qq);
            });
            container.innerHTML = rows.length ? rows.map(item => {
                const state = gmkStates.get(item.qq);
                const open = state && state.open;
                const count = state && state.loaded ? state.cards.filter(card => !card.deleted).length : item.count;
                return `<div class="border-[3px] border-black bg-white/80"><button onclick="toggleGmkObject('${item.qq}')" class="w-full flex justify-between p-4 font-black text-left"><span>对象：${item.qq}</span><span>${count} 张 ${open ? '▲' : '▼'}</span></button><div id="gmk-detail-${item.qq}" class="${open ? '' : 'hidden'} border-t-[2px] border-black p-4"></div></div>`;
            }).join('') : '<p class="text-center font-bold p-8">没有匹配的对象。</p>';
            rows.forEach(item => { const state = gmkStates.get(item.qq); if (state && state.open && state.loaded) renderGmkDetail(item.qq); });
        }

        async function toggleGmkObject(qq) {
            const state = gmkState(qq);
            state.open = !state.open;
            if (state.open && !state.loaded) {
                renderGmkObjects();
                try {
                    const response = await gmkFetch(`/api/gmk/${document.getElementById('group-id-input').value}/objects/${qq}`);
                    const data = await response.json();
                    state.cards = data.cards || [];
                    state.nextIndex = state.cards.reduce((max, card) => Math.max(max, Number((card.file.match(/_(\d+)\./) || [0, 0])[1])), 0) + 1;
                    state.loaded = true;
                } catch (error) { state.error = error.message; }
            }
            renderGmkObjects();
        }

        async function loadGmkPreview(qq, card, target) {
            if (card.previewUrl) { target.src = card.previewUrl; return; }
            const groupId = document.getElementById('group-id-input').value;
            const thumb = card.kind === 'image' ? '?thumbnail=true' : '';
            try {
                const response = await gmkFetch(`/api/gmk/${groupId}/media/${encodeURIComponent(card.file)}${thumb}`);
                card.previewUrl = URL.createObjectURL(await response.blob());
                target.src = card.previewUrl;
            } catch { target.replaceWith(Object.assign(document.createElement('span'), { innerText: '预览加载失败' })); }
        }

        function renderGmkDetail(qq) {
            const state = gmkState(qq);
            const target = document.getElementById(`gmk-detail-${qq}`);
            if (!target) return;
            if (state.error) { target.innerText = state.error; return; }
            const cards = state.cards.filter(card => !card.deleted);
            target.innerHTML = `<div class="flex flex-wrap gap-3 mb-4">${cards.map((card, i) => `<div class="w-36 border-[2px] border-black p-2"><div class="h-24 flex items-center justify-center bg-gray-100">${card.kind === 'video' ? `<button onclick="playGmkVideo('${qq}', ${i})" class="font-bold">▶ 播放视频</button>` : `<img id="gmk-img-${qq}-${i}" class="max-h-24 max-w-full" alt="冠名卡">`}</div><button onclick="deleteGmkCard('${qq}', ${i})" class="mt-2 w-full border-[2px] border-black bg-red-300 font-bold">删除</button></div>`).join('')}</div><div class="flex gap-3"><input id="gmk-upload-${qq}" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4" multiple class="hidden" onchange="addGmkFiles('${qq}', this.files)"><button onclick="document.getElementById('gmk-upload-${qq}').click()" class="border-[2px] border-black p-2 font-bold bg-[#e6f4e8]">上传图片 / GIF / MP4</button></div>`;
            cards.forEach((card, i) => { if (card.kind !== 'video') loadGmkPreview(qq, card, document.getElementById(`gmk-img-${qq}-${i}`)); });
        }

        async function playGmkVideo(qq, index) {
            const card = gmkState(qq).cards.filter(item => !item.deleted)[index];
            const groupId = document.getElementById('group-id-input').value;
            try {
                const response = await gmkFetch(`/api/gmk/${groupId}/media/${encodeURIComponent(card.file)}`);
                const url = URL.createObjectURL(await response.blob());
                window.open(url, '_blank', 'noopener');
            } catch (error) { showMessage(error.message); }
        }

        async function compressGmkImage(file) {
            if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
            const image = await createImageBitmap(file);
            const scale = Math.min(1, 1920 / Math.max(image.width, image.height));
            if (scale === 1 && file.size < 1024 * 1024) return file;
            const canvas = document.createElement('canvas'); canvas.width = Math.round(image.width * scale); canvas.height = Math.round(image.height * scale);
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', 0.85));
            return new File([blob || file], file.name.replace(/\.[^.]+$/, '.webp'), { type: 'image/webp' });
        }

        async function addGmkFiles(qq, files) {
            const state = gmkState(qq);
            for (const rawFile of Array.from(files)) {
                if (!/^(image\/(jpeg|png|webp|gif)|video\/mp4)$/.test(rawFile.type)) continue;
                const file = await compressGmkImage(rawFile);
                const ext = file.name.split('.').pop().toLowerCase();
                const name = `${qq}_${state.nextIndex++}.${ext}`;
                state.cards.push({ file: name, add_time: Date.now() / 1000, kind: file.type === 'video/mp4' ? 'video' : (file.type === 'image/gif' ? 'gif' : 'image'), localFile: file, previewUrl: file.type === 'video/mp4' ? null : URL.createObjectURL(file) });
            }
            state.changed = true; renderGmkObjects();
        }

        function deleteGmkCard(qq, index) { const state = gmkState(qq); state.cards.filter(card => !card.deleted)[index].deleted = true; state.changed = true; renderGmkObjects(); }
        function promptGmkUser() { const qq = prompt('请输入 QQ 号'); if (!qq || !/^\d+$/.test(qq)) return; if (!gmkObjects.some(item => item.qq === qq)) gmkObjects.push({ qq, count: 0 }); const state = gmkState(qq); state.open = true; state.loaded = true; renderGmkObjects(); }

        function appendGmkChanges(formData) {
            const changes = {};
            for (const [qq, state] of gmkStates) {
                if (!state.changed) continue;
                changes[qq] = state.cards.filter(card => !card.deleted).map(card => ({ file: card.file, add_time: card.add_time }));
                state.cards.filter(card => !card.deleted && card.localFile).forEach(card => formData.append('new_gmk_media', card.localFile, card.file));
            }
            formData.append('gmk_changes', JSON.stringify(changes));
        }

        async function loadDataToUI(data) {
            globalOriginalData = { ...globalOriginalData, ...data };
            initialFilePaths.clear();

            document.getElementById('phrases-container').innerHTML = '';
            document.getElementById('commands-container').innerHTML = '';
            document.getElementById('paimian-container').innerHTML = '';
            document.getElementById('huaka-container').innerHTML = '';
            document.getElementById('shield-container').innerHTML = '';

            const collectFiles = (segments) => {
                if (Array.isArray(segments)) {
                    segments.forEach(s => { if (s.type === 'image') initialFilePaths.add(s.file); });
                }
            };

            if (data.preset_lines && Array.isArray(data.preset_lines)) {
                data.preset_lines.forEach(lineSegments => {
                    collectFiles(lineSegments);
                    addPhrase(formatSegmentsToHtml(lineSegments));
                });
            }
            if (document.getElementById('phrases-container').children.length === 0) addPhrase();

            if (data.custom_commands && typeof data.custom_commands === 'object') {
                Object.entries(data.custom_commands).forEach(([trigger, segments]) => {
                    collectFiles(segments);
                    addCommand(trigger, formatSegmentsToHtml(segments));
                });
            }
            if (document.getElementById('commands-container').children.length === 0) addCommand();

            if (data.paimian_lines && Array.isArray(data.paimian_lines)) {
                data.paimian_lines.forEach(item => addTextItem('paimian-container', item, '请输入排面模板内容 (支持多行，可用变量 名字、金额)'));
            }
            if (document.getElementById('paimian-container').children.length === 0) addTextItem('paimian-container', '', '请输入排面模板内容 (支持多行，可用变量 名字、金额)');

            if (data.huaka_lines && Array.isArray(data.huaka_lines)) {
                data.huaka_lines.forEach(item => addTextItem('huaka-container', item, '请输入划卡模板内容 (支持多行，可用变量如 会员1、接待1、金额1、时间1)'));
            }
            if (document.getElementById('huaka-container').children.length === 0) addTextItem('huaka-container', '', '请输入划卡模板内容 (支持多行，可用变量如 会员1、接待1、金额1、时间1)');

            if (data.shield_words && Array.isArray(data.shield_words)) {
                data.shield_words.forEach(item => addTextItem('shield-container', item, '请输入需要拦截的屏蔽词...'));
            }
            if (document.getElementById('shield-container').children.length === 0) addTextItem('shield-container', '', '请输入需要拦截的屏蔽词...');

            if (data.laxian_gifs && data.laxian_gifs.length > 0) {
                const laxianPath = data.laxian_gifs[0];
                initialFilePaths.add(laxianPath);
                const previewDiv = document.getElementById('laxian-preview');
                previewDiv.innerHTML = `<img src="${API_BASE_URL}/activity/${laxianPath}" data-original-file="${laxianPath}" style="max-height: 250px; border: 4px solid black;">`;
                document.getElementById('laxian-btn-text').innerText = "更换GIF";
                document.getElementById('laxian-clear-btn').classList.remove('hidden');
            } else {
                clearLaxian();
            }
        }

        function formatSegmentsToHtml(segments) {
            if (!segments || !Array.isArray(segments)) { return typeof segments === 'string' ? segments : ''; }
            let html = '';
            segments.forEach(seg => {
                if (seg.type === 'text') {
                    html += seg.text.replace(/\n/g, '<br>');
                } else if (seg.type === 'image') {
                    html += `<img src="${API_BASE_URL}/activity/${seg.file}" data-original-file="${seg.file}">`;
                }
            });
            if (html !== '') { html += '<br><br>'; }
            return html;
        }

        function extractTextArray(containerId) {
            const arr = [];
            const textareas = document.querySelectorAll(`#${containerId} .text-item textarea`);
            textareas.forEach(ta => {
                const val = ta.value.trim();
                if (val !== '') { arr.push(val); }
            });
            return arr;
        }

        async function submitData() {
            const groupId = document.getElementById('group-id-input').value.trim();
            if (!groupId) { showMessage('无法读取到有效的目标群号！'); return; }

            showMessage('正在安全打包并加密上传数据到服务器，请稍候...');

            const formData = new FormData();
            formData.append('group_id', groupId);

            const preset_lines = [];
            const custom_commands = {};
            usedFilePaths.clear();
            let imageIndex = 0;

            async function processContent(element, type) {
                let segments = [];
                let currentText = "";

                async function traverse(node) {
                    if (node.nodeType === Node.TEXT_NODE) {
                        currentText += node.textContent;
                    } else if (node.nodeType === Node.ELEMENT_NODE) {
                        const tag = node.tagName.toLowerCase();
                        if (tag === 'br') { currentText += "\n"; }
                        else if (tag === 'img') {
                            if (currentText) {
                                segments.push({ type: "text", text: currentText });
                                currentText = "";
                            }
                            const srcAttr = node.getAttribute('src');
                            let filePath = "";

                            if (srcAttr && srcAttr.startsWith('data:image')) {
                                const mimeType = srcAttr.substring(5, srcAttr.indexOf(';'));
                                let ext = 'jpg';
                                if (mimeType.includes('png')) ext = 'png';
                                else if (mimeType.includes('gif')) ext = 'gif';
                                else if (mimeType.includes('webp')) ext = 'webp';

                                const fileName = `${type}_${Date.now()}_${imageIndex++}.${ext}`;
                                filePath = `${groupId}/${type}/${fileName}`;

                                const res = await fetch(srcAttr);
                                const imageBlob = await res.blob();

                                let imageFileObj;
                                try {
                                    imageFileObj = new File([imageBlob], fileName, { type: mimeType });
                                } catch (e) {
                                    imageFileObj = imageBlob;
                                }

                                formData.append('new_images', imageFileObj, fileName);
                                node.setAttribute('src', `${API_BASE_URL}/activity/${filePath}`);
                                node.setAttribute('data-original-file', filePath);
                            }
                            else if (node.hasAttribute('data-original-file')) {
                                filePath = node.getAttribute('data-original-file');
                            }

                            if (filePath) {
                                segments.push({ type: "image", file: filePath });
                                usedFilePaths.add(filePath);
                            }
                        } else {
                            const isBlock = tag === 'div' || tag === 'p';
                            if (isBlock && currentText && !currentText.endsWith('\n')) currentText += '\n';
                            for (let child of node.childNodes) await traverse(child);
                            if (isBlock && currentText && !currentText.endsWith('\n')) currentText += '\n';
                        }
                    }
                }

                for (let child of element.childNodes) await traverse(child);
                if (currentText) segments.push({ type: "text", text: currentText });

                if (segments.length > 0) {
                    if (segments[0].type === 'text') { segments[0].text = segments[0].text.trimStart(); }
                    if (segments[segments.length - 1].type === 'text') { segments[segments.length - 1].text = segments[segments.length - 1].text.trimEnd(); }
                }

                return segments.filter(s => !(s.type === 'text' && s.text === ''));
            }

            try {
                const phraseDivs = document.querySelectorAll('#phrases-container .phrase-item div[contenteditable="true"]');
                for (const div of phraseDivs) {
                    if (div.innerText.trim() !== '' || div.querySelector('img')) {
                        const segs = await processContent(div, 'line');
                        if (segs.length > 0) preset_lines.push(segs);
                    }
                }

                const commandRows = document.querySelectorAll('#commands-container .command-item');
                for (const row of commandRows) {
                    const editables = row.querySelectorAll('div[contenteditable]');
                    if (editables.length === 2) {
                        const triggerText = editables[0].innerText.trim();
                        if (triggerText !== '') {
                            const segs = await processContent(editables[1], 'cmd');
                            if (segs.length > 0) custom_commands[triggerText] = segs;
                        }
                    }
                }

                const paimian_lines = extractTextArray('paimian-container');
                const huaka_lines = extractTextArray('huaka-container');
                const shield_words = extractTextArray('shield-container');

                const newLaxianGifs = [];
                const laxianPreviewDiv = document.getElementById('laxian-preview');
                const laxianImg = laxianPreviewDiv.querySelector('img');

                if (laxianImg) {
                    const srcAttr = laxianImg.getAttribute('src');
                    let filePath = "";
                    if (srcAttr.startsWith('data:image')) {
                        const mimeType = srcAttr.substring(5, srcAttr.indexOf(';'));
                        let ext = 'gif';
                        if (mimeType.includes('jpg') || mimeType.includes('jpeg')) ext = 'jpg';
                        else if (mimeType.includes('png')) ext = 'png';
                        else if (mimeType.includes('webp')) ext = 'webp';

                        const fileName = `laxian_${Date.now()}_${imageIndex++}.${ext}`;
                        filePath = `${groupId}/laxian/${fileName}`;

                        const res = await fetch(srcAttr);
                        const imageBlob = await res.blob();

                        let imageFileObj;
                        try {
                            imageFileObj = new File([imageBlob], fileName, { type: mimeType });
                        } catch (e) {
                            imageFileObj = imageBlob;
                        }

                        formData.append('new_images', imageFileObj, fileName);
                        laxianImg.setAttribute('data-original-file', filePath);
                        usedFilePaths.add(filePath);
                    } else if (laxianImg.hasAttribute('data-original-file')) {
                        filePath = laxianImg.getAttribute('data-original-file');
                        usedFilePaths.add(filePath);
                    }
                    if (filePath) { newLaxianGifs.push(filePath); }
                }

                globalOriginalData.preset_lines = preset_lines;
                globalOriginalData.custom_commands = custom_commands;
                globalOriginalData.paimian_lines = paimian_lines;
                globalOriginalData.huaka_lines = huaka_lines;
                globalOriginalData.shield_words = shield_words;
                globalOriginalData.laxian_gifs = newLaxianGifs;

                formData.append('json_data', JSON.stringify(globalOriginalData));

                const filesToDelete = [];
                for (const path of initialFilePaths) {
                    if (!usedFilePaths.has(path)) { filesToDelete.push(path); }
                }
                formData.append('deleted_images', JSON.stringify(filesToDelete));
                appendGmkChanges(formData);
                appendGmkSettings(formData);

                const response = await fetch(`${API_BASE_URL}/api/upload`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Token': currentToken || ""
                    }
                });

                if (response.status === 403) {
                    showMessage("⛔ 提交失败：此安全链接已被消耗或已过期作废！\n请在群内重新获取。");
                    return;
                }

                if (!response.ok) throw new Error(`服务器响应错误: ${response.status}`);

                initialFilePaths = new Set(usedFilePaths);
                const deleteMsg = filesToDelete.length > 0 ? ` 并清理了 ${filesToDelete.length} 张废弃图片。` : "。";
                showMessage(`保存成功！\n数据已同步到服务器${deleteMsg}\n\n👉 提示：短句等群配置需在 QQ 群发送【重载数据】后生效；群设置会在下次贵宾欢迎或冠名卡处理时生效。`);

            } catch (err) {
                console.error(err);
                showMessage(`同步失败，请检查服务器网络连接：\n${err.message}`);
            }
        }
    </script>
